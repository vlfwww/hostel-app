name: Hotel CI

on:
  push:
    branches: ["lab-9", "main", "master"]
  pull_request:

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Восстановление
        run: dotnet restore Hotel.sln

      - name: Сборка
        run: dotnet build Hotel.sln --configuration Release --no-restore

      - name: Тесты
        run: dotnet test Hotel.sln --configuration Release --no-build --verbosity normal

      - name: Публикация API
        run: dotnet publish HotelApi/HotelApi.csproj --configuration Release --output ${{ github.workspace }}/artifacts/api

      - name: Публикация Blazor
        run: dotnet publish HotelBlazor/HotelBlazor.csproj --configuration Release --output ${{ github.workspace }}/artifacts/web

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: hotel-publish
          path: artifacts/

  docker:
    runs-on: ubuntu-latest
    needs: build-test-publish
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Образы
        run: docker compose build
